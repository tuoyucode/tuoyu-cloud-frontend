name: CI

on:
  push:
    branches: [master, dev, business]
  pull_request:
    branches: [master, dev, business]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: Asia/Shanghai
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: 检查（lint、类型检查、单元测试）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # 业务分支要与 dev 比较，需要完整历史
          fetch-depth: 0

      - name: 框架与业务分开（见 CONTRIBUTING.md“分支”）
        # push 时检查当前分支，PR 时按合并的目标分支检查
        run: python3 scripts/ci/check_branch_scope.py "${{ github.base_ref || github.ref_name }}"

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: |
          pnpm -F @tuoyu/shared run typecheck
          pnpm -F @vben/web-antd run typecheck
          pnpm -F @vben/web-ele run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      # 端到端测试需要后端，在 e2e.yml 中手动触发；这里只确认测试文件能被 Playwright 正常加载
      - name: E2E tests load
        run: pnpm -F @vben/web-antd exec playwright test --list

  build:
    name: 构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build Ant Design Vue
        run: pnpm run build:antd

      - name: Build Element Plus
        run: pnpm run build:ele
