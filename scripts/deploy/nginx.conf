#user  nobody;
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  server_tokens off;

  # 上传请求的上限，与后端默认的整个上传请求上限（100MB）一致；Nginx 默认只有 1MB
  client_max_body_size 100m;

  # 前端生产包的接口前缀为 /api（.env.production 的 VITE_GLOB_API_URL）。
  # 从原始请求中去掉前缀，路径中的编码与查询参数原样转发给网关，与开发服务器的代理相同
  map $request_uri $gateway_path {
    ~^/api(?<rest>/.*)$ $rest;
    default /;
  }

  server {
    listen 8080;
    server_name localhost;

    # Docker 内置 DNS：网关地址在请求时才解析，网关未启动或不在同一网络时 Nginx 仍能启动（接口返回 502）
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
    }

    location /api/ {
      # 网关地址：默认是后端 compose 网络中的网关（单体也使用这个名称），按部署环境修改。
      # 网关默认只信任回环地址的转发头，要记录客户端的真实 IP，按后端仓库 deploy/docker/README.md 配置可信代理
      set $gateway http://tuoyu-gateway:8081;
      proxy_pass $gateway$gateway_path;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # 消息推送（SSE）是长连接：读超时要长于后端的心跳间隔（默认 60 秒），并且不能缓冲
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 86400s;
      proxy_buffering off;
      proxy_cache off;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
